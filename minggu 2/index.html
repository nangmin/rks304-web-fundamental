<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/png" href="foto/logo web.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-b from-[#D2FF00] to-[#111112] min-h-screen flex items-center justify-center">

    <div class="bg-white w-full max-w-md p-8 rounded-lg shadow-md">

        <h1 class="text-2xl font-bold text-center mb-6">
            Admin Login
        </h1>

        <form>
            <div class="mb-4">
                <label class="block mb-2">
                    Username
                </label>

                <input
                    type="text"
                    placeholder="Masukkan username"
                    class="w-full border rounded-lg px-4 py-2"
                >
            </div>

            <div class="mb-6">
                <label class="block mb-2">
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Masukkan password"
                    class="w-full border rounded-lg px-4 py-2"
                >
            </div>

            <a
                href="dashboard.html"
                class="block text-center bg-[#D2FF00] text-black py-2 rounded-lg hover:bg-[#a9cc03]"
            >
                Login
            </a>
        </form>

    </div>

</body>
</html>
