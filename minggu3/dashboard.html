<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Admin Panel</title>
    <link rel="icon" type="image/png" href="foto/logo web.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-gray-800 min-h-screen flex flex-col">
    <div 
        class="fixed inset-0 bg-cover bg-center opacity-85 -z-10"
        style="background-image: url('foto/background.png');">
    </div>

    <header class="bg-[#D2FF00] text-[#111112] p-1">
        <h1 class="text-2xl font-bold px-4">Dashboard</h1>
    </header>

    <nav class="bg-[#111112] text-white p-4">
        <div class="flex gap-5">
            <a href="dashboard.html" class="text-[#D2FF00]">Dashboard</a>
            <a href="products.html" class="hover:text-[#D2FF00]">Products</a>
            <a href="#" class="hover:text-[#D2FF00]">Users</a>
            <a href="#" class="hover:text-[#D2FF00]">Setting</a>
            <a href="index.html" id="logoutBtn" class="text-red-400 hover:text-white">Logout</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 flex-1 w-full">
        <h2 class="text-3xl text-white font-bold mb-1 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">
            Dashboard
        </h2>
        <p id="welcomeText" class="text-white mb-6 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">Selamat datang kembali</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
            <div class="bg-white/50 p-5 rounded-lg shadow backdrop-blur-sm">
                <p class="font-medium">Total Produk</p>
                <h3 class="text-3xl font-bold mt-2">120</h3>
            </div>
            <div class="bg-white/50 p-5 rounded-lg shadow backdrop-blur-sm">
                <p class="font-medium">Total Pengguna</p>
                <h3 class="text-3xl font-bold mt-2">350</h3>
            </div>
            <div class="bg-white/50 p-5 rounded-lg shadow backdrop-blur-sm">
                <p class="font-medium">Pesanan</p>
                <h3 class="text-3xl font-bold mt-2">85</h3>
            </div>
            <div class="bg-white/50 p-5 rounded-lg shadow backdrop-blur-sm">
                <p class="font-medium">Pendapatan</p>
                <h3 class="text-3xl font-bold mt-2">Rp8.500.000</h3>
            </div>
        </div>
    </main>

    <footer class="bg-[#111112] text-white text-center p-6 w-full">
        <p>&copy; 2026 Admin Panel</p>
    </footer>

    <script>
        const nama = sessionStorage.getItem("namaPengguna") || sessionStorage.getItem("loggedInUser") || "Administrator";
        document.getElementById("welcomeText").textContent = "Selamat datang kembali " + nama;

        document.getElementById("logoutBtn").addEventListener("click", function() {
            sessionStorage.clear();
        });
    </script>
</body>
</html>
