<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - Admin Panel</title>
    <link rel="icon" type="image/png" href="foto/logo web.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-gray-800 min-h-screen flex flex-col">
    <div 
        class="fixed inset-0 bg-cover bg-center opacity-85 -z-10"
        style="background-image: url('foto/background.png');">
    </div>

    <header class="bg-[#D2FF00] text-[#111112] p-1">
        <h1 class="text-2xl font-bold px-4">Edit Product</h1>
    </header>

    <nav class="bg-[#111112] text-white p-4">
        <div class="flex gap-5">
            <a href="dashboard.html" class="hover:text-[#D2FF00]">Dashboard</a>
            <a href="products.html" class="hover:text-[#D2FF00]">Products</a>
            <a href="#" class="hover:text-[#D2FF00]">Users</a>
            <a href="#" class="hover:text-[#D2FF00]">Setting</a>
            <a href="index.html" class="hover:text-white">Logout</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 flex-1 w-full">
        <h2 class="text-3xl text-white font-bold mb-6 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">
            Edit Produk
        </h2>

        <form class="bg-white/80 p-6 rounded-lg shadow backdrop-blur-sm space-y-4" onsubmit="event.preventDefault(); alert('Perubahan produk berhasil disimpan!'); window.location.href='products.html';">
            <div>
                <label class="block mb-2 font-medium">Name</label>
                <input
                    type="text"
                    value="Laptop"
                    required
                    class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#111112] outline-none"
                >
            </div>

            <div>
                <label class="block mb-2 font-medium">Stock</label>
                <input
                    type="number"
                    value="10"
                    required
                    min="0"
                    class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#111112] outline-none"
                >
            </div>

            <div>
                <label class="block mb-2 font-medium">Description</label>
                <textarea
                    required
                    class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#111112] outline-none"
                    rows="4"
                >Laptop untuk kebutuhan kerja dan belajar</textarea>
            </div>

            <button
                type="submit"
                class="bg-[#D2FF00] text-black font-semibold px-6 py-2.5 rounded-lg hover:bg-[#a9cc03] transition-colors"
            >
                Submit
            </button>
        </form>
    </main>

    <footer class="bg-[#111112] text-white text-center p-6 w-full">
        <p>&copy; 2026 Admin Panel</p>
    </footer>
</body>
</html>
