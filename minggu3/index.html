<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Panel</title>
    <link rel="icon" type="image/png" href="foto/logo web.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-b from-[#D2FF00] to-[#111112] min-h-screen flex items-center justify-center">

    <div class="bg-white w-full max-w-md p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold text-center mb-6">
            Admin Login
        </h1>

        <form id="loginForm">
            <div class="mb-4">
                <label class="block mb-2 text-sm font-medium">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                    class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#D2FF00]"
                >
                <p id="usernameError" class="text-red-600 text-xs mt-1"></p>
            </div>

            <div class="mb-4">
                <label class="block mb-2 text-sm font-medium">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#D2FF00]"
                >
                <p id="passwordError" class="text-red-600 text-xs mt-1"></p>
            </div>

            <div id="formMessage" class="mb-4 text-center text-sm font-medium"></div>

            <button
                type="submit"
                class="w-full block text-center bg-[#D2FF00] text-black font-semibold py-2 rounded-lg hover:bg-[#a9cc03] transition-colors"
            >
                Login
            </button>
        </form>

        <p class="text-center text-xs text-slate-400 mt-5">
            Belum punya akun? <a href="register.html" class="text-blue-600 font-medium hover:underline">Daftar</a>
        </p>
    </div>

    <script src="login.js"></script>
</body>
</html>
