<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Admin Panel</title>
    <link rel="icon" type="image/png" href="foto/logo web.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-b from-[#D2FF00] to-[#111112] min-h-screen flex items-center justify-center py-10">

    <div class="bg-white w-full max-w-md p-8 rounded-lg shadow-md">

        <h1 class="text-2xl font-bold text-center mb-2">
            Register
        </h1>

        <p class="text-center text-slate-500 mb-6">
            Silakan isi data diri Anda
        </p>

        <form id="registerForm" novalidate class="space-y-4" action="dashboard.html">

            <div>
                <label for="username" class="block mb-1 font-medium text-[#111112]">
                    Username
                </label>
                <input type="text" id="username" name="username"
                    placeholder="Minimal 3 karakter"
                    class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-[#111112] outline-none">
                <p id="usernameError" class="text-red-600 text-xs mt-1"></p>
            </div>

            <div>
                <label for="password" class="block mb-1 font-medium text-[#111112]">
                    Password
                </label>
                <input type="password" id="password" name="password"
                    placeholder="Minimal 8 karakter"
                    class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-[#111112] outline-none">
                <p id="passwordError" class="text-red-600 text-xs mt-1"></p>
            </div>

            <div>
                <label for="nama" class="block mb-1 font-medium text-[#111112]">
                    Nama Lengkap
                </label>
                <input type="text" id="nama" name="nama"
                    placeholder="Masukkan nama lengkap"
                    class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-[#111112] outline-none">
                <p id="namaError" class="text-red-600 text-xs mt-1"></p>
            </div>

            <div>
                <label for="tanggalLahir" class="block mb-1 font-medium text-[#111112]">
                    Tanggal Lahir
                </label>
                <input type="date" id="tanggalLahir" name="tanggalLahir"
                    class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-[#111112] outline-none">
                <p id="tanggalLahirError" class="text-red-600 text-xs mt-1"></p>
            </div>

            <div>
                <label for="alamat" class="block mb-1 font-medium text-[#111112]">
                    Alamat
                </label>
                <textarea id="alamat" name="alamat" rows="3"
                    placeholder="Masukkan alamat lengkap"
                    class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-[#111112] outline-none"></textarea>
                <p id="alamatError" class="text-red-600 text-xs mt-1"></p>
            </div>

            <div>
                <label for="telepon" class="block mb-1 font-medium text-[#111112]">
                    Nomor Telepon
                </label>

                <div class="flex">
                    <span class="flex items-center px-4 bg-[#111112] border border-slate-300 rounded-l-lg font-bold text-[#D2FF00]">
                        +62
                    </span>
                    <input type="tel" id="telepon" name="telepon"
                        inputmode="numeric"
                        placeholder="81234567890"
                        class="w-full min-w-0 border border-l-0 border-slate-300 rounded-r-lg p-3 focus:ring-2 focus:ring-[#111112] outline-none">
                </div>
                <p id="teleponError" class="text-red-600 text-xs mt-1"></p>
            </div>

            <p id="formMessage" class="text-sm font-medium text-center"></p>

            <button type="submit"
                class="w-full bg-[#D2FF00] hover:bg-[#a9cc03] text-[#111112] font-bold py-3 rounded-lg transition duration-200">
                Daftar
            </button>

        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
            Sudah punya akun? <a href="index.html" class="text-blue-600 font-medium hover:underline">Masuk</a>
        </p>

    </div>

    <script src="validasi_input.js"></script>
</body>
</html>
